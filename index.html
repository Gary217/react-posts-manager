<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react-posts-manager</title>
    <script type="text/javascript">
      // Современный вариант декодера путей
      ((l) => {
        if (l.search.slice(0, 2) === '/?') {
          const decoded = l.search
            .slice(2)
            .split('&')
            .map((s) => s.replace(/~and~/g, '&'))
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + (decoded ? '/' + decoded : '') + l.hash
          );
        }
      })(window.location);
    </script>
    <script type="module" crossorigin src="/react-posts-manager/assets/index-DFN8M1Vu.js"></script>

  </head>

  </body>
</html>
